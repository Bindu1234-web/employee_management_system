<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Employee Dashboard</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<h2 style="text-align:center;">Employee Dashboard</h2>

<div style="text-align:center; margin-top:30px;">

<input type="text" id="name" placeholder="Employee Name">
<input type="text" id="department" placeholder="Department">

<button onclick="addEmployee()">Add Employee</button>

</div>

<h3 style="text-align:center; margin-top:30px;">Employee List</h3>

<ul id="employeeList" style="text-align:center;"></ul>

<script>

function addEmployee(){

let name=document.getElementById("name").value;
let department=document.getElementById("department").value;

if(name=="" || department==""){
alert("Please fill all fields");
return;
}

let li=document.createElement("li");

li.innerHTML=name + " - " + department +
" <button onclick='deleteEmployee(this)'>Delete</button>";

document.getElementById("employeeList").appendChild(li);

document.getElementById("name").value="";
document.getElementById("department").value="";

}

function deleteEmployee(button){
button.parentElement.remove();
}

</script>

</body>
</html>
